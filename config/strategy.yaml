# Marketing Strategy for PLANDOG
# Auto-evolved by Level 1 Evolution
# Manual edits are welcome — they will be preserved as baseline.

version: 1
last_updated: "2026-04-13"
updated_by: "manual"

# ── 콘텐츠 전략 ────────────────────────────────────────
content_strategy:
  themes:
    - "product_updates"      # 플랜도그 신기능, 업데이트 소식
    - "industry_insights"    # PM/UX 업계 인사이트, 트렌드
    - "tips_and_tricks"      # 기획서 작성 팁, 생산성 향상법
    - "customer_stories"     # 사용 후기, 활용 사례
    - "pain_point_content"   # 기획자가 겪는 문제 공감 콘텐츠
  theme_weights:
    product_updates: 0.15
    industry_insights: 0.20
    tips_and_tricks: 0.30
    customer_stories: 0.15
    pain_point_content: 0.20
  content_mix:
    educational: 0.35       # 기획 팁, UX 지식
    promotional: 0.20       # 플랜도그 기능 소개, CTA
    engagement: 0.30        # 질문, 공감, 토론
    brand_awareness: 0.15   # 브랜드 인지도

posting_optimization:
  best_times:
    twitter: ["09:30", "12:30", "18:00"]
  best_days:
    high_engagement: ["tuesday", "wednesday", "thursday"]
    low_engagement: ["saturday", "sunday"]

engagement_tactics:
  hashtag_strategy: "mix_popular_niche"
  max_hashtags: 5    # Twitter는 해시태그 적게
  call_to_action: true
  question_posts_ratio: 0.25   # 4개 중 1개는 질문형
  emoji_usage: "moderate"

performance_thresholds:
  min_engagement_rate: 0.02
  target_engagement_rate: 0.05
  min_click_rate: 0.01
  alert_drop_percentage: 0.3
