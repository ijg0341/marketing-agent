product:
  name: 플랜도그 (PLANDOG)
  description: 대화 기반 화면설계서 생성 AI 도구 — 요구사항을 대화로 정리하여 IA, 화면 구성, 디스크립션을 포함한 UX 설계서를 자동 생성
  website: https://plandog.net/
  category: SaaS

brand:
  tone: professional_friendly
  voice_guidelines: |
    - ~합니다 체 사용, 전문적이되 친근하게
    - UX/PM 업계 용어 자연스럽게 사용 (SSOT, 핸드오프, 와이어프레임, IA 등)
    - 효율성과 생산성 강조 ("5분 만에", "바로 공유", "한 번에")
    - 이모지는 적절히 사용 (🚀 📄 ✅ 정도, 과하지 않게)
    - 클릭 유도 시 직접적인 CTA ("지금 무료로 시작하세요", "5분이면 충분합니다")
  language: ko
  hashtag_pool:
    - "#플랜도그"
    - "#PLANDOG"
    - "#AI기획"
    - "#UX설계"
    - "#와이어프레임"
    - "#화면설계서"
    - "#PM도구"
    - "#기획자도구"
    - "#AI자동화"
    - "#프로덕트매니저"
    - "#SaaS"
    - "#업무생산성"
    - "#핸드오프"
    - "#SSOT"

target_audience:
  demographics:
    age_range: "25-45"
    interests:
      - "UX/UI 디자인"
      - "프로덕트 매니지먼트"
      - "스타트업"
      - "AI 도구"
      - "업무 자동화"
      - "SaaS"
  pain_points:
    - "화면설계서 작성에 시간이 너무 많이 걸림 (평균 3-5일)"
    - "기획서 수정할 때마다 문서 전체를 다시 정리해야 함"
    - "개발 핸드오프 시 누락되는 내용이 많아 재작업 발생"
    - "비전문가(대표, 클라이언트)에게 기획을 설명하기 어려움"
    - "여러 도구(피그마, 노션, PPT)를 왔다갔다 해야 함"
  value_propositions:
    - "대화만으로 5분 내 화면설계서 초안 완성"
    - "SSOT 기반으로 수정사항이 문서 전체에 자동 반영"
    - "A4 벡터 PDF로 즉시 공유·출력 가능"
    - "AI 질문으로 누락된 요구사항 자동 발견"

competitors:
  - "Figma — 디자인 중심, 기획서 작성에는 별도 플러그인 필요"
  - "Whimsical — 와이어프레임 가능하나 AI 자동생성 없음"
  - "Notion AI — 문서 중심, 구조화된 화면설계서 생성 불가"
  - "Miro — 보드 중심, 산출물 표준화 어려움"

context: |
  ## 제품/서비스 소개
  플랜도그(PLANDOG)는 대화 기반 화면설계서 생성 AI 도구입니다.
  요구사항을 자연어로 입력하면, IA(정보구조), 화면 구성, 디스크립션을 포함한
  완성도 높은 UX 설계서를 자동으로 생성합니다.

  주요 기능:
  - 자연어 기반 와이어프레임 자동 생성
  - SSOT(Single Source of Truth) 기반 일관된 문서 관리
  - A4 가로형 벡터 PDF 즉시 출력·공유
  - AI Agent의 추가 질문으로 요구사항 정교화
  - 스마트 페이지네이션 (자동 레이아웃)

  ## 타겟 오디언스
  - PM/기획자: 회의 전 초안 확보, 피드백 루프 단축
  - 1인 개발·창업팀: 아이디어를 빠르게 문서화
  - SI/에이전시: 산출물 표준화, 반복 수정 대응
  - 개발팀: 핸드오프 과정에서 누락 감소

  ## 마케팅 핵심 메시지
  - "기획서, 5분이면 됩니다" — 속도 강조
  - "수정해도 문서가 안 깨집니다" — SSOT 가치
  - "PDF로 바로 공유하세요" — 즉시 활용 가능
  - "AI가 빠진 부분을 물어봅니다" — 품질 보장

  ## 해시태그 전략
  - 핵심: #플랜도그 #PLANDOG #AI기획
  - 타겟: #PM도구 #기획자도구 #프로덕트매니저
  - 트렌드: #AI자동화 #업무생산성 #SaaS
